services:
  app:
    build: .
    container_name: cicd-portfolio-app
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: cicd-portfolio-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
